#baseURL = 'https://www.lifecoach4u.nl/'
baseURL = 'https://thethoughtless.github.io/Lifecoach4u-site'
languageCode = 'nl'
title = 'Lifecoach4u'
theme = 'beautifulhugo'
[caches]
  [caches.images]
    dir = ':cacheDir/images'
[services]
  [services.googleAnalytics]
    id = 'G-9PTWJ10NPR'


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[module.hugoVersion]
      
[Params]
  toc = false
  subtitle = 'persoonlijke coaching in de Krimpenerwaard'
  logo = '/images/Selfie1.png'
  showPageDates = false
  hideAuthor = true
  hidePostDates = true
  relativeURLs = true

  [Params.author]
      name = "Johan Verrips"
      website = "lifecoach4u.nl"
      email = "info@lifecoach4u.nl" 

[[Params.bigimg]]
  #src = "/images/banner-weg cropped.jpg"
  src='/images/tiendweg banner.jpg'
  desc = "De weg door het leven"
  headerImgStyle = "narrow"


[[menus.main]]
